version: 2.1

jobs:
  laravel-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, fileinfo, mysql

    # 1. Rencana Penyebaran (Deploy Marker - Plan)
    - name: Plan a deploy
      run: |
        circleci run release plan \
          --environment-name="uangku" \
          --component-name="appp" \
          --target-version="1.0.0"

    - name: Copy Environment File
      run: cp .env.example .env

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-progress --no-suggest --prefer-dist

    - name: Generate App Key
      run: php artisan key:generate

    - name: Run Tests (PHPUnit)
      run: vendor/bin/phpunit
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'

    # (Opsional) Tambahkan langkah proses deploy aplikasi Laravel Anda di sini
    # Contoh: - name: Deploy to Server
    #   run: ...

    # 2. Update Status Penyebaran Menjadi BERHASIL
    - name: Update a deploy to SUCCESS
      command: circleci run release update --status=SUCCESS
      when: on_success

    # 3. Update Status Penyebaran Menjadi GAGAL (Jika ada proses yang error/gagal)
    - name: Update planned deploy to FAILED
      command: circleci run release update --status=FAILED
      when: on_fail
